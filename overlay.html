<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saleh &amp; Shatha Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@500;600&family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Transparent text layer composited over the kids video (720x1280). */
  :root { --ink: #1c1617; --red: #a3192b; --line: #3a3030; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 720px; height: 1280px; background: transparent; }
  .t { position: absolute; left: 0; right: 0; text-align: center; color: var(--ink); }
  .small { font-family: 'Cinzel', serif; font-weight: 500; font-size: 21px; letter-spacing: 4.5px; line-height: 34px; }
  .big   { font-family: 'Cinzel', serif; font-weight: 500; font-size: 64px; letter-spacing: 2px; line-height: 1; }
  .rule  { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; }
  .rule i { display: block; height: 1.5px; background: var(--line); }
  .heart { width: 18px; height: 16px; }
  .row { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 16px;
         font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 25px; letter-spacing: 4px; color: var(--ink); }
  .row svg { width: 30px; height: 30px; }
  .ar { font-family: 'Amiri', serif; font-weight: 700; direction: rtl; }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="h" viewBox="0 0 24 22"><path d="M12 21 C 4 14, 0 10, 0 6 A 6 6 0 0 1 12 4 A 6 6 0 0 1 24 6 C 24 10, 20 14, 12 21 Z" fill="#a3192b"/></symbol>
  </svg>

  <!-- top block -->
  <div class="t small" style="top:58px">YOU ARE INVITED<br>TO THE WEDDING OF</div>
  <div class="t big" style="top:140px">SALEH</div>
  <div class="rule" style="top:210px"><i style="width:110px"></i><svg class="heart"><use href="#h"/></svg><i style="width:110px"></i></div>
  <div class="t big" style="top:238px">SHATHA</div>
  <div class="row ar" style="top:308px; font-size:28px; letter-spacing:0; gap:12px">
    <svg class="heart" style="width:20px;height:18px"><use href="#h"/></svg><span>صالح وشذا</span><svg class="heart" style="width:20px;height:18px"><use href="#h"/></svg>
  </div>

  <!-- bottom block -->
  <div class="row" style="top:1022px">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1c1617" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2M15 17h2" stroke-width="2"/></svg>
    <span>15 NOVEMBER 2026</span>
  </div>
  <div class="rule" style="top:1070px"><i style="width:110px"></i></div>
  <div class="row" style="top:1088px">
    <span>SUNDAY</span><span style="opacity:.5">|</span><span class="ar" style="letter-spacing:0; font-size:27px">يوم الأحد</span>
  </div>
  <div class="rule" style="top:1136px"><i style="width:110px"></i></div>
  <div class="row ar" style="top:1150px; font-size:27px; letter-spacing:0">وبحضوركم يكتمل فرحنا</div>
  <div class="rule" style="top:1208px"><i style="width:80px"></i><svg class="heart"><use href="#h"/></svg><i style="width:80px"></i></div>
</body>
</html>
