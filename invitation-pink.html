<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زفاف صالح وشذا</title>
<link rel="preload" href="fonts/amiri-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/aref-ruqaa-700-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --bg1: #fbeee9;
    --bg2: #f3d9d1;
    --ink: #4a3236;
    --rose: #c9787f;
    --gold: #b8935a;
    --branch: #8a6a5e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #e9d3cc; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; padding-bottom: 64px; }
  #stage {
    position: relative;
    width: 720px; height: 1280px;
    transform-origin: center center;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 40%, var(--bg1) 0%, var(--bg2) 100%);
    box-shadow: 0 20px 60px rgba(90, 50, 50, .25);
  }
  body.capture { background: transparent; display: block; }
  body.capture #stage { box-shadow: none; transform: none !important; }
  #paper { position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; }
  #art { position: absolute; inset: 0; }
  .txt {
    position: absolute; left: 0; right: 0; text-align: center;
    color: var(--ink); will-change: opacity, transform;
  }
  #bism  { top: 46px; font-family: 'Amiri', serif; font-size: 26px; color: var(--branch); }
  #arch {
    position: absolute; left: 160px; top: 100px; width: 400px; height: 480px;
    border-radius: 200px 200px 22px 22px; overflow: hidden;
    border: 5px solid #c9a46a; outline: 1.5px solid #c9a46a; outline-offset: 7px;
    box-shadow: 0 14px 36px rgba(110, 60, 60, .25);
    background: #efe6dc; will-change: opacity, transform;
  }
  /* crop of the kids footage: source x 110..640, y 350..986 */
  #arch video { position: absolute; width: 543px; height: 966px; left: -88px; top: -269px; }
  #invite{ top: 598px; font-family: 'Amiri', serif; font-size: 30px; line-height: 1.6; }
  #groom { top: 640px; font-family: 'Aref Ruqaa', serif; font-size: 104px; line-height: 1.2; }
  #amp   { top: 752px; font-family: 'Great Vibes', cursive; font-size: 72px; color: var(--rose); direction: ltr; }
  #bride { top: 808px; font-family: 'Aref Ruqaa', serif; font-size: 104px; line-height: 1.2; }
  #en    { top: 948px; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 30px; letter-spacing: 10px; direction: ltr; color: var(--gold); }
  #divider { top: 995px; height: 20px; }
  #day   { top: 1030px; font-family: 'Amiri', serif; font-size: 32px; }
  #date  { top: 1078px; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 52px; letter-spacing: 6px; direction: ltr; }
  #outro { top: 1170px; font-family: 'Amiri', serif; font-size: 28px; color: var(--rose); }
  #start {
    position: absolute; inset: 0; z-index: 5; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: rgba(251, 238, 233, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    font-family: 'Amiri', serif; color: var(--ink); transition: opacity .6s;
  }
  #start .seal {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e5a0a4, #b5636b);
    box-shadow: 0 10px 30px rgba(120, 50, 60, .35), inset 0 -6px 14px rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Aref Ruqaa', serif; font-size: 44px; color: #fff6ef;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #start .hint { font-size: 34px; }
  #start.gone { opacity: 0; pointer-events: none; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  body.capture #start { display: none; }
  #replay {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-family: 'Amiri', serif; font-size: 18px; padding: 8px 22px; border-radius: 999px;
    border: 1px solid var(--gold); background: rgba(255,255,255,.7); color: var(--ink); cursor: pointer;
  }
  body.capture #replay { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="paper" width="720" height="1280"></canvas>
  <div id="arch"><video id="kids" src="kids.mp4" muted playsinline preload="auto"></video></div>
  <svg id="art" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="petalPink" cx="50%" cy="80%" r="80%">
        <stop offset="0" stop-color="#e8a3a6"/><stop offset="1" stop-color="#f6cfcc"/>
      </radialGradient>
      <radialGradient id="petalWhite" cx="50%" cy="80%" r="80%">
        <stop offset="0" stop-color="#f1e2d8"/><stop offset="1" stop-color="#fffaf6"/>
      </radialGradient>
      <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e6cf9a"/><stop offset=".5" stop-color="#b8935a"/><stop offset="1" stop-color="#8c6a3a"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7a4a48" flood-opacity=".18"/>
      </filter>
      <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <g id="branches"></g>
    <g id="petals"></g>
    <g id="sparkles"></g>
  </svg>

  <div class="txt" id="bism">بسم الله الرحمن الرحيم</div>
  <div class="txt" id="invite">نتشرف بدعوتكم لحضور حفل زفاف</div>
  <div class="txt" id="groom">صالح</div>
  <div class="txt" id="amp">&amp;</div>
  <div class="txt" id="bride">شذا</div>
  <div class="txt" id="en">SALEH &amp; SHATHA</div>
  <svg class="txt" id="divider" viewBox="0 0 720 20">
    <g id="divG" stroke="#b8935a" stroke-width="1.5" fill="none">
      <line x1="230" y1="10" x2="340" y2="10"/>
      <line x1="380" y1="10" x2="490" y2="10"/>
      <path d="M360 2 L368 10 L360 18 L352 10 Z" fill="#c9787f" stroke="none"/>
    </g>
  </svg>
  <div class="txt" id="day">يوم الأحد</div>
  <div class="txt" id="date">15 . 11 . 2026</div>
  <div class="txt" id="outro">وبحضوركم يكتمل فرحنا</div>
  <div id="start"><div class="seal">ص&nbsp;ش</div><div class="hint">اضغط لفتح الدعوة</div></div>
</div>
<button id="replay">إعادة التشغيل ↺</button>

<script>
const DURATION = 20;            // seconds per loop (matches kids.mp4)
const W = 720, H = 1280;
const NS = 'http://www.w3.org/2000/svg';

// Deterministic PRNG so every frame (and every capture) is identical.
function rng(seed) {
  return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOutBack = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const prog = (t, start, dur) => clamp((t - start) / dur);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- paper texture ----------
(function paper() {
  const c = document.getElementById('paper').getContext('2d');
  const img = c.createImageData(W, H), r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 235 + r() * 20;
    img.data[i] = v; img.data[i + 1] = v - 4; img.data[i + 2] = v - 6; img.data[i + 3] = 255;
  }
  c.putImageData(img, 0, 0);
})();

// ---------- flowering branches ----------
const flowers = [];   // {g, start, scale}
const stems = [];     // {path, len, start, dur}
function flower(parent, x, y, size, white, rot) {
  const g = el('g', { transform: `translate(${x} ${y})`, filter: 'url(#soft)' }, parent);
  const inner = el('g', {}, g);
  const fill = white ? 'url(#petalWhite)' : 'url(#petalPink)';
  for (let i = 0; i < 5; i++) {
    el('ellipse', {
      cx: 0, cy: -size * .55, rx: size * .38, ry: size * .55, fill,
      stroke: white ? '#e9d6c8' : '#e3a0a0', 'stroke-width': .6,
      transform: `rotate(${rot + i * 72})`
    }, inner);
  }
  el('circle', { r: size * .2, fill: white ? '#e8c27a' : '#c9787f' }, inner);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    el('circle', { cx: Math.cos(a) * size * .28, cy: Math.sin(a) * size * .28, r: size * .05, fill: '#a0704a' }, inner);
  }
  return inner;
}
function bud(parent, x, y, size) {
  const g = el('g', { transform: `translate(${x} ${y})` }, parent);
  const inner = el('g', {}, g);
  el('ellipse', { rx: size * .35, ry: size * .55, fill: '#eeb3b2', stroke: '#d98f92', 'stroke-width': .6 }, inner);
  return inner;
}
function growBranch(parent, r, x0, y0, dirX, length, startT, depth) {
  // A gently curving stem built from a quadratic chain; twigs and flowers sprout along it.
  let x = x0, y = y0, ang = -Math.PI / 2 + dirX * (0.25 + r() * 0.35);
  const segs = 5 + Math.floor(r() * 3);
  const step = length / segs;
  let d = `M${x.toFixed(1)} ${y.toFixed(1)}`;
  const pts = [];
  const left = x0 < W / 2;
  for (let i = 0; i < segs; i++) {
    ang += (r() - .5) * .6 - dirX * .05;
    // keep the vines in the side margins so the text stays clear
    if (left && x > 150) ang = Math.min(ang, -Math.PI / 2) - .35;
    if (!left && x < W - 150) ang = Math.max(ang, -Math.PI / 2) + .35;
    const cx = x + Math.cos(ang) * step * .5, cy = y + Math.sin(ang) * step * .5;
    x += Math.cos(ang) * step; y += Math.sin(ang) * step;
    d += ` Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
    pts.push([x, y, ang]);
  }
  const path = el('path', {
    d, fill: 'none', stroke: '#8a6a5e', 'stroke-width': Math.max(.8, 3 - depth),
    'stroke-linecap': 'round', opacity: .85
  }, parent);
  const dur = 1.6 + r() * .8;
  stems.push({ path, len: 0, start: startT, dur });
  pts.forEach(([px, py, a], i) => {
    const tHere = startT + dur * ((i + 1) / segs);
    if (depth < 2 && r() < .55) {
      growBranch(parent, r, px, py, r() < .5 ? -1 : 1, length * (.35 + r() * .2), tHere, depth + 1);
    }
    const n = r() < .7 ? 1 : 2;
    for (let k = 0; k < n; k++) {
      const ox = (r() - .5) * 26, oy = (r() - .5) * 26;
      const size = 9 + r() * (depth === 0 ? 11 : 7);
      const node = r() < .2
        ? bud(parent, px + ox, py + oy, size * .8)
        : flower(parent, px + ox, py + oy, size, r() < .4, r() * 72);
      flowers.push({ g: node, start: tHere + r() * .3, scale: 1 });
    }
  });
}
(function buildBranches() {
  const g = document.getElementById('branches');
  const r = rng(2026);
  // Left and right vines climbing the edges, plus a few hanging from the top corners.
  for (let i = 0; i < 4; i++) growBranch(g, r, 10 + r() * 50, H + 10 - i * 300, 1, 260 + r() * 100, .2 + i * .35, 0);
  for (let i = 0; i < 4; i++) growBranch(g, r, W - 10 - r() * 50, H + 10 - i * 300, -1, 260 + r() * 100, .4 + i * .35, 0);
  stems.forEach(s => {
    s.len = s.path.getTotalLength();
    s.path.setAttribute('stroke-dasharray', s.len);
  });
})();

// ---------- kids video in the arch ----------
const arch = document.getElementById('arch');
const kids = document.getElementById('kids');
// Capture mode: seek the video to t and wait until that frame is decoded.
window.seekVideo = t => new Promise(res => {
  const target = Math.min(t, kids.duration - 0.02);
  if (Math.abs(kids.currentTime - target) < 1e-3) return res();
  kids.addEventListener('seeked', () => res(), { once: true });
  kids.currentTime = target;
});

// ---------- falling petals ----------
const petalLayer = document.getElementById('petals');
const petals = [];
(function buildPetals() {
  const r = rng(1511);
  for (let i = 0; i < 26; i++) {
    const p = el('ellipse', { rx: 5 + r() * 4, ry: 8 + r() * 5, fill: r() < .6 ? '#eeb0b0' : '#fbefe8', opacity: .85 }, petalLayer);
    petals.push({ p, x: r() * W, speed: 50 + r() * 60, phase: r() * 20, sway: 20 + r() * 30, spin: (r() - .5) * 200, delay: 1 + r() * 4 });
  }
})();

// ---------- sparkles ----------
const sparkleLayer = document.getElementById('sparkles');
const sparkles = [];
(function buildSparkles() {
  const r = rng(99);
  for (let i = 0; i < 14; i++) {
    const s = el('path', { d: 'M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z', fill: '#e6cf9a' }, sparkleLayer);
    // around the arch's rim
    const a = Math.PI * (1 + r());
    sparkles.push({ s, x: 360 + Math.cos(a) * (225 + r() * 20), y: 300 + Math.sin(a) * (225 + r() * 20), period: 1.5 + r() * 1.5, off: r() * 3 });
  }
})();

// ---------- text timeline ----------
const T = id => document.getElementById(id);
const texts = [
  { e: T('bism'),   at: .3,  mode: 'fade' },
  { e: T('invite'), at: 3.0, mode: 'up' },
  { e: T('groom'),  at: 4.0, mode: 'zoom' },
  { e: T('amp'),    at: 4.8, mode: 'fade' },
  { e: T('bride'),  at: 5.4, mode: 'zoom' },
  { e: T('en'),     at: 6.4, mode: 'spread' },
  { e: T('divider'),at: 7.0, mode: 'wipe' },
  { e: T('day'),    at: 7.4, mode: 'up' },
  { e: T('date'),   at: 7.9, mode: 'up' },
  { e: T('outro'),  at: 9.0, mode: 'fade' },
];

// ---------- render a single frame at time t (seconds) ----------
function render(t) {
  // global fade at loop end so the loop is seamless
  const out = 1 - prog(t, DURATION - .8, .8);

  stems.forEach(s => {
    const k = ease(prog(t, s.start, s.dur));
    s.path.setAttribute('stroke-dashoffset', (s.len * (1 - k)).toFixed(1));
  });
  flowers.forEach((f, i) => {
    const k = easeOutBack(prog(t, f.start, .7));
    const sway = Math.sin(t * 1.3 + i) * 4 * clamp(k);
    f.g.setAttribute('transform', `scale(${k.toFixed(3)}) rotate(${sway.toFixed(2)})`);
  });

  // arch with the kids: rises and fades in right at the start
  const ka = ease(prog(t, 0, 1.2));
  arch.style.opacity = (ka * out).toFixed(3);
  arch.style.transform = `translateY(${(24 * (1 - ka)).toFixed(1)}px) scale(${(.96 + .04 * ka).toFixed(3)})`;

  sparkles.forEach(s => {
    const ph = ((t + s.off) % s.period) / s.period;
    const a = t > 2.6 ? Math.sin(ph * Math.PI) : 0;
    s.s.setAttribute('transform', `translate(${s.x} ${s.y}) scale(${(a * .9).toFixed(3)}) rotate(${(ph * 90).toFixed(1)})`);
    s.s.setAttribute('opacity', (a * out).toFixed(3));
  });

  petals.forEach(p => {
    const lt = t - p.delay;
    if (lt < 0) { p.p.setAttribute('opacity', 0); return; }
    const y = ((lt * p.speed + p.phase * 60) % (H + 80)) - 40;
    const x = p.x + Math.sin(lt * 1.2 + p.phase) * p.sway;
    p.p.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(lt * p.spin).toFixed(1)})`);
    p.p.setAttribute('opacity', (.8 * clamp(lt) * out).toFixed(3));
  });

  texts.forEach(({ e, at, mode }) => {
    const k = ease(prog(t, at, 1.1));
    let tr = '';
    if (mode === 'up') tr = `translateY(${(30 * (1 - k)).toFixed(1)}px)`;
    if (mode === 'zoom') tr = `scale(${(1.25 - .25 * k).toFixed(3)})`;
    if (mode === 'spread') { e.style.letterSpacing = (2 + 8 * k).toFixed(1) + 'px'; }
    if (mode === 'wipe') e.style.clipPath = `inset(0 ${(50 * (1 - k)).toFixed(1)}% 0 ${(50 * (1 - k)).toFixed(1)}%)`;
    e.style.transform = tr;
    e.style.filter = mode === 'zoom' ? `blur(${(6 * (1 - k)).toFixed(2)}px)` : '';
    e.style.opacity = (k * out).toFixed(3);
  });
  document.getElementById('art').style.opacity = 1;
  document.getElementById('branches').setAttribute('opacity', out.toFixed(3));
}
window.renderAt = render;
window.DURATION = DURATION;

// ---------- live playback ----------
const capture = new URLSearchParams(location.search).has('capture');
if (capture) document.body.classList.add('capture');
function fit() {
  if (capture) return;
  const s = Math.min(innerWidth / W, (innerHeight - 64) / H, 1);
  document.getElementById('stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();
// The video is the clock, so the animation stays in sync with the kids.
function loop() {
  render(kids.currentTime % DURATION);
  requestAnimationFrame(loop);
}
if (!capture) {
  kids.loop = true;
  // Browsers block autoplay with sound, so the invitation opens on a tap — then plays exactly like the video.
  const playFromStart = () => { kids.muted = false; kids.currentTime = 0; kids.play(); };
  const start = document.getElementById('start');
  document.fonts.ready.then(() => render(DURATION - 4));   // full invitation behind the blurred cover
  start.onclick = () => {
    start.classList.add('gone');
    playFromStart();
    requestAnimationFrame(loop);
  };
  document.getElementById('replay').onclick = () => {
    if (!start.classList.contains('gone')) return start.onclick();
    playFromStart();
  };
} else {
  render(0);
}
</script>
</body>
</html>
